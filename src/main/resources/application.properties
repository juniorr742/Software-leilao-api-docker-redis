spring.application.name=Auction

# configura  o do banco de dados

# Configuração do Oracle Autonomous Database (OCI)
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_DB_ALIAS}?TNS_ADMIN=${ORACLE_WALLET_PATH}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialeto do Hibernate para o Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect


# Agora o Spring JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show.sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=minha-chave-secreta-muito-segura-e-longa-para-o-algoritmo-hs256
jwt.expiration=8640

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
